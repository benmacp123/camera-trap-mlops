# Dependencies for every environment, each pinned once; uv.lock pins the
# full tree. Not an installable package: the Makefile runs the code with
# PYTHONPATH=src.
[project]
name = "camera-trap-mlops"
version = "0.1.0"
description = "Site-level promotion gate, trust report and drift study for camera-trap classifiers"
readme = "README.md"
license = "MIT"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
# Manifest, gate, drift study, replay, report and tracking: everything that
# runs on cached embeddings. CI installs only this (through dev), so it
# never downloads the model stack.
core = [
    "numpy==2.5.4",
    "polars==2.0.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "mlflow==3.17.2",
    "huggingface-hub==2.3.0",
]
# Embedding and the trainable arms. torch comes from the CPU wheel index
# (see [tool.uv.sources]); the PyPI Linux wheel pulls in about 3 GB of CUDA.
models = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "open-clip-torch==3.3.0",
    "timm==1.0.30",
    "pillow==13.0.0",
]
# SpeciesNet, kept apart because it pulls in yolov5 (GPL) for its detector;
# this project only calls it, never vendors it.
baselines = [
    { include-group = "models" },
    "speciesnet==5.0.6",
]
dev = [
    { include-group = "core" },
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pylint==4.1.3",
    "black==26.10.1",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.12.3"
# Linux (CI, Lambda, this machine) and Apple-silicon Macs. Intel Macs are
# left out: speciesnet pins numpy<2 there, which conflicts with core.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
